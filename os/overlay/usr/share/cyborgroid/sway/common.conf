# Shared by the mobile and desktop sway sessions.
font pango:Noto Sans CJK KR 11
output * bg #141418 solid_color
xwayland enable
seat seat0 hide_cursor 3000

# The window that the Avalonia home screen runs in.
assign [class="cyborgroid-shell"] workspace number 1
for_window [class="cyborgroid-shell"] border none

# Per-device display settings, for example panel rotation.
include /etc/cyborgroid/sway.d/*.conf
