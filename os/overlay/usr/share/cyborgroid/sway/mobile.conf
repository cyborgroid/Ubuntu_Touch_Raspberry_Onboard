include /usr/share/cyborgroid/sway/common.conf

# One full-screen app at a time on the apps workspace; the tabs double as the
# app switcher. Not a global workspace_layout, which would put a title bar over
# the home screen on workspace 1.
for_window [workspace="^2$"] layout tabbed
default_border none
default_floating_border none

# Ubuntu's GTK apps start through systemd and D-Bus services, which must know which
# display to use. This is what /etc/sway/config.d does in a stock sway session.
exec systemctl --user import-environment WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XMODIFIERS
exec dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XMODIFIERS

exec /usr/lib/cyborgroid/shell-loop.sh
exec waybar --config /usr/share/cyborgroid/waybar/mobile.jsonc --style /usr/share/cyborgroid/waybar/mobile.css
# Korean typing: the keyboard's Hangul layer sends the keys and fcitx5 composes them.
exec fcitx5 -d
exec wvkbd-mobintl --hidden -H 460 -l full,hangul,special
