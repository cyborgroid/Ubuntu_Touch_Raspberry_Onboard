include /usr/share/cyborgroid/sway/common.conf

# One full-screen app at a time on the apps workspace; the tabs double as the
# app switcher. Not a global workspace_layout, which would put a title bar over
# the home screen on workspace 1.
for_window [workspace="^2$"] layout tabbed
default_border none
default_floating_border none

exec /usr/lib/cyborgroid/shell-loop.sh
exec waybar --config /usr/share/cyborgroid/waybar/mobile.jsonc --style /usr/share/cyborgroid/waybar/mobile.css
exec wvkbd-mobintl --hidden -L 220
