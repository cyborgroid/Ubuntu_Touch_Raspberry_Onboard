# Read by /usr/lib/cyborgroid/wireguard-killswitch.sh

WG_IF="wg0"
WG_CONF="/etc/wireguard/wg0.conf"

# 1 lets this device talk to private (RFC 1918) addresses outside the tunnel.
# Needed for captive portals and LAN printers, but on shared Wi-Fi it also lets
# other clients reach this device, so it is off by default.
ALLOW_LAN=0
