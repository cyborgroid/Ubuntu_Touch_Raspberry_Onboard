# Per-device display settings for the touch session. The official 5-inch Touch
# Display 2 is natively 720x1280 portrait, which needs nothing here. Find connector
# names with `swaymsg -t get_outputs`. For landscape use, for example:
#output DSI-1 transform 90

# Only exists under os/run-vm.sh, whose window would otherwise resize the virtual
# screen to fit itself. A real Pi has no output with this name.
output Virtual-1 mode --custom 720x1280
